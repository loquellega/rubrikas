<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Firmar · Rubrikas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233d8b10'/%3E%3Cpath d='M6 21c4-9 7-12 9-9s-3 9 1 7 5-9 8-8-1 7 3 5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="estilo.css">
<style>
  .contenido{max-width:900px;margin:0 auto;padding:18px 14px 130px;display:grid;gap:18px}
  .intro{display:grid;gap:12px}
  .docs-lista{display:grid;gap:6px}
  .docs-lista div{display:flex;gap:8px;align-items:center;background:#f2f1ec;border-radius:10px;padding:9px 12px;font-weight:600}
  .mensaje{border-left:4px solid var(--primario);padding:4px 0 4px 12px;white-space:pre-wrap;color:#333}
  .paginas{padding-top:24px}
  .campo.mio{cursor:pointer}
  .campo.mio:not(.lleno){animation:latido 2s ease-in-out infinite}
  .campo.mio .pide{font-weight:700;font-size:14px;color:#fff;background:var(--primario);padding:4px 12px;border-radius:999px;white-space:nowrap}
  .campo.ajeno{--c:#9a9890}
  @keyframes latido{50%{background:color-mix(in srgb,var(--c) 30%,transparent)}}
  .barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.06)}
  .barra>div{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .barra .primario{flex:none;min-width:170px}
  .lienzo{position:relative;background:#fff;border:2px solid var(--linea);border-radius:12px;touch-action:none;height:220px;overflow:hidden}
  .lienzo canvas{width:100%;height:100%;display:block;cursor:crosshair}
  .lienzo .guia{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:2px solid #e0ded6;pointer-events:none}
  .lienzo .x{position:absolute;left:5%;bottom:29%;color:#bbb;font-size:20px;pointer-events:none}
  .lienzo .indica{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;pointer-events:none;font-size:15px}
  .vista{background:#fafaf8;border:2px dashed var(--linea);border-radius:12px;min-height:140px;display:grid;place-items:center;padding:10px;text-align:center;color:var(--tenue);cursor:pointer}
  .vista img{max-width:90%;max-height:150px}
  .campo .herr{position:fixed;left:50%;top:auto;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;padding:6px}
  .campo .herr button{font-size:16px;padding:9px 14px}
  .aviso{bottom:calc(160px + env(safe-area-inset-bottom))}
  .codigo{font-size:26px;letter-spacing:.35em;text-align:center;font-weight:700}
  .final{text-align:center;display:grid;gap:14px;justify-items:center;padding:30px 22px}
  .ok-circulo{width:76px;height:76px;border-radius:50%;background:var(--primario-claro);color:var(--primario);display:grid;place-items:center;font-size:40px}
  .resumen-firma{display:flex;gap:14px;align-items:center;background:#fafaf8;border-radius:12px;padding:12px}
  .resumen-firma img{max-height:56px;max-width:160px}
</style>
</head>
<body>
<header class="cabeza"><span class="logo" id="logo"></span><span class="crece"></span></header>
<main id="raiz"></main>
<script type="module" src="firmar.js"></script>
</body>
</html>
